name: Go Lint

# Manually lint changes against a selected base (the previous commit by default).
# Existing lint findings outside the diff are excluded.
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Git base ref to compare against (e.g. HEAD~1 or a commit SHA)"
        required: true
        default: "HEAD~1"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GOPROXY: https://proxy.golang.org,direct

jobs:
  # Only lint modules changed since the selected base.
  changes:
    name: detect lint modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changed modules
        id: detect
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          base_sha=$(git rev-parse --verify --end-of-options "${BASE_REF}^{commit}")
          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
          diff_range="${base_sha}...${GITHUB_SHA}"
          modules=()
          if git diff --name-only --diff-filter=ACMR "$diff_range" -- \
               .golangci.yml .github/workflows/go-lint.yml | grep -q .; then
            modules=("." "cli" "client")
          else
            if git diff --name-only --diff-filter=ACMR "$diff_range" -- \
                 '*.go' ':!cli/**' ':!client/**' go.mod go.sum | grep -q .; then
              modules+=(".")
            fi
            if git diff --name-only --diff-filter=ACMR "$diff_range" -- 'cli/**' | grep -q .; then
              modules+=("cli")
            fi
            if git diff --name-only --diff-filter=ACMR "$diff_range" -- 'client/**' | grep -q .; then
              modules+=("client")
            fi
          fi
          json="["
          first=1
          for m in "${modules[@]}"; do
            if [ "$first" -eq 1 ]; then
              first=0
            else
              json+=","
            fi
            json+="\"${m}\""
          done
          json+="]"
          echo "modules=${json}" >> "$GITHUB_OUTPUT"
          echo "Lint modules: ${json}"

  golangci:
    name: golangci-lint (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}
          # Filter from git using the verified base commit.
          only-new-issues: false
          args: --new-from-merge-base=${{ needs.changes.outputs.base_sha }}
